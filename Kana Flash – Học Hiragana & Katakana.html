<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kana Flash – Học Hiragana & Katakana</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#18213a;--mute:#69718a;--line:#d9dfeb;--acc:#3b4fd8;--accs:#e4e8fd;--ok:#1b8f61;--bad:#d6455d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#1a2033;--ink:#e8ecf8;--mute:#9099b3;--line:#2c3550;--acc:#8c9bff;--accs:#252d52;--ok:#4cc999;--bad:#ff7a90;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#1a2033;--ink:#e8ecf8;--mute:#9099b3;--line:#2c3550;--acc:#8c9bff;--accs:#252d52;--ok:#4cc999;--bad:#ff7a90;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.25rem;margin:4px 0 12px;font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px 2px;border-radius:9px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.kana.w{font-size:3.6rem;overflow-wrap:anywhere}
.rom.sm{font-size:1.8rem;margin-top:8px}
.mean{font-size:1.7rem;font-weight:700;margin-top:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;min-height:64px}
.slot{min-width:52px;height:62px;padding:0 8px;border:0;border-bottom:3px solid var(--line);background:none;color:var(--ink);font-size:2rem;cursor:pointer}
span.slot{cursor:default}
.slot.right{color:var(--ok);border-color:var(--ok)}
.slot.wrong{color:var(--bad);border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.tile{flex:none;font-size:1.8rem;padding:12px 16px;min-width:58px}
.btn:disabled{opacity:.25;cursor:default}
.tabs button.on{background:var(--acc);color:#fff;font-weight:600}
:root[data-theme="dark"] .tabs button.on{color:#0f1320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0f1320}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:600}
.stat{margin-bottom:14px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.stat p{margin:6px 0 0;font-size:.82rem;color:var(--mute)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:pointer;user-select:none;text-align:center}
.kana{font-size:7.5rem;line-height:1.1;font-weight:700}
.kana.sm{font-size:2.4rem;color:var(--mute);font-weight:400}
.rom{font-size:4.2rem;font-weight:700;color:var(--acc);line-height:1.1}
.hint{color:var(--mute);font-size:.85rem;margin-top:12px}
.spk{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:var(--bg);border-radius:50%;width:42px;height:42px;font-size:1.1rem;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0f1320}}
:root[data-theme="dark"] .btn.pri{color:#0f1320}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts .btn{font-size:1.4rem;padding:16px}
.btn.right{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
input.ans{width:100%;margin-top:14px;padding:14px;font:inherit;font-size:1.3rem;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input.ans:focus,.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.spk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fb{margin-top:10px;text-align:center;font-weight:600;min-height:1.6em}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin-bottom:8px}
.tips h2{font-size:1.05rem;margin:20px 0 6px}
.tips p,.tips li{color:var(--ink);margin:4px 0}
.tips ul{padding-left:20px;margin:6px 0}
.tips .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:8px}
.pair{display:inline-block;background:var(--accs);border-radius:8px;padding:2px 10px;margin:3px 4px 3px 0;font-size:1.2rem}
.reset{margin-top:24px;background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:.85rem;cursor:pointer}
@media (max-width:380px){.kana{font-size:6rem}}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs button{flex:1 0 auto;padding:9px 10px}
.wbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;touch-action:none}
#wsv{display:block;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1/1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wsv path,#wsv circle,#wsv text{pointer-events:none}
.wgr{stroke:var(--mute);stroke-width:.5;stroke-dasharray:3 3;fill:none;opacity:.35}
.wgh,.wdn,.wan,.wus,.wlv,.wans,.whn{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wgh{stroke:var(--mute);stroke-width:7;opacity:.25}
.wdn,.wan{stroke:var(--ink);stroke-width:5}
.wus{stroke:var(--ink);stroke-width:4.5}
.wlv{stroke:var(--acc);stroke-width:4.5}
.wans{stroke:var(--acc);stroke-width:4;opacity:.75}
.whn{stroke:var(--acc);stroke-width:6.5;opacity:.85}
.wdot{fill:var(--acc)}
.wnum{fill:var(--bg);font:700 6px system-ui,sans-serif;text-anchor:middle}
.shake{animation:wsh .3s}
@keyframes wsh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.wstrip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-top:14px;-webkit-overflow-scrolling:touch}
.wstrip .chip{flex:none;font-size:1.1rem;padding:6px 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="jp">かな · Kana Flash</h1>
  <div class="tabs" id="tabs"></div>
  <div id="cfg"></div>
  <div id="stat" class="stat"></div>
  <div id="main"></div>
  <div style="text-align:center"><button class="reset" onclick="resetAll()">Xoá tiến độ học</button><p style="font-size:.75rem;color:var(--mute);margin:10px 0 0">Dữ liệu thứ tự nét: KanjiVG (Ulrich Apel), giấy phép CC BY-SA 3.0</p></div>
</div>
<script>
const H="あ a,い i,う u,え e,お o,か ka,き ki,く ku,け ke,こ ko,さ sa,し shi,す su,せ se,そ so,た ta,ち chi,つ tsu,て te,と to,な na,に ni,ぬ nu,ね ne,の no,は ha,ひ hi,ふ fu,へ he,ほ ho,ま ma,み mi,む mu,め me,も mo,や ya,ゆ yu,よ yo,ら ra,り ri,る ru,れ re,ろ ro,わ wa,を wo,ん n";
const D="が ga,ぎ gi,ぐ gu,げ ge,ご go,ざ za,じ ji,ず zu,ぜ ze,ぞ zo,だ da,ぢ ji,づ zu,で de,ど do,ば ba,び bi,ぶ bu,べ be,ぼ bo,ぱ pa,ぴ pi,ぷ pu,ぺ pe,ぽ po";
const ALIAS={si:"shi",ti:"chi",tu:"tsu",hu:"fu",zi:"ji",di:"ji",du:"zu",wo:"o",sya:"sha",syu:"shu",syo:"sho",tya:"cha",tyu:"chu",tyo:"cho",zya:"ja",zyu:"ju",zyo:"jo",jya:"ja",jyu:"ju",jyo:"jo"};
const Y="きゃ kya,きゅ kyu,きょ kyo,しゃ sha,しゅ shu,しょ sho,ちゃ cha,ちゅ chu,ちょ cho,にゃ nya,にゅ nyu,にょ nyo,ひゃ hya,ひゅ hyu,ひょ hyo,みゃ mya,みゅ myu,みょ myo,りゃ rya,りゅ ryu,りょ ryo,ぎゃ gya,ぎゅ gyu,ぎょ gyo,じゃ ja,じゅ ju,じょ jo,びゃ bya,びゅ byu,びょ byo,ぴゃ pya,ぴゅ pyu,ぴょ pyo";
const X="ファ fa,フィ fi,フェ fe,フォ fo,ヴァ va,ヴィ vi,ヴ vu,ヴェ ve,ヴォ vo,ツァ tsa,ツェ tse,ツォ tso";
const W="あめ|ame|mưa,いえ|ie|nhà,うみ|umi|biển,えき|eki|nhà ga,おかね|okane|tiền,かさ|kasa|cái ô,かお|kao|khuôn mặt,くるま|kuruma|xe hơi,くつ|kutsu|giày,けしき|keshiki|phong cảnh,こえ|koe|giọng nói,さかな|sakana|cá,さくら|sakura|hoa anh đào,しお|shio|muối,すし|sushi|sushi,せんせい|sensei|giáo viên,そら|sora|bầu trời,たまご|tamago|trứng,つくえ|tsukue|cái bàn học,てがみ|tegami|lá thư,とり|tori|con chim,なまえ|namae|tên,にく|niku|thịt,ねこ|neko|con mèo,いぬ|inu|con chó,のり|nori|rong biển,はな|hana|bông hoa,ひと|hito|con người,ふね|fune|con thuyền,へや|heya|căn phòng,ほし|hoshi|ngôi sao,ほん|hon|quyển sách,まど|mado|cửa sổ,みず|mizu|nước,むし|mushi|côn trùng,やま|yama|núi,ゆき|yuki|tuyết,よる|yoru|ban đêm,りんご|ringo|quả táo,れきし|rekishi|lịch sử,わたし|watashi|tôi,さけ|sake|rượu sake,おちゃ|ocha|trà,かばん|kaban|cặp túi,とけい|tokei|đồng hồ,はし|hashi|đôi đũa,がっこう|gakkou|trường học,ともだち|tomodachi|bạn bè,きょう|kyou|hôm nay,しゃしん|shashin|bức ảnh,りょこう|ryokou|du lịch,でんしゃ|densha|tàu điện,じてんしゃ|jitensha|xe đạp,びょういん|byouin|bệnh viện,ぎゅうにゅう|gyuunyuu|sữa bò,にほん|nihon|Nhật Bản,おはよう|ohayou|chào buổi sáng,こんにちは|konnichiwa|xin chào,ありがとう|arigatou|cảm ơn,さようなら|sayounara|tạm biệt,おいしい|oishii|ngon,たべもの|tabemono|đồ ăn,のみもの|nomimono|đồ uống,コーヒー|koohii|cà phê,ビール|biiru|bia,アイス|aisu|kem,ホテル|hoteru|khách sạn,テレビ|terebi|ti vi,パン|pan|bánh mì,ケーキ|keeki|bánh ngọt,バス|basu|xe buýt,タクシー|takushii|taxi,カメラ|kamera|máy ảnh,ペン|pen|cây bút,ノート|nooto|quyển vở,レストラン|resutoran|nhà hàng,トイレ|toire|nhà vệ sinh,ドア|doa|cánh cửa,テーブル|teeburu|cái bàn,ベッド|beddo|giường,シャワー|shawaa|vòi hoa sen,ラジオ|rajio|radio,ピアノ|piano|đàn piano,ギター|gitaa|đàn guitar,サッカー|sakkaa|bóng đá,テニス|tenisu|quần vợt,スポーツ|supootsu|thể thao,パソコン|pasokon|máy tính,メール|meeru|thư điện tử,ニュース|nyuusu|tin tức,アメリカ|amerika|nước Mỹ,ベトナム|betonamu|Việt Nam,ミルク|miruku|sữa,サラダ|sarada|salad,スープ|suupu|món súp,チーズ|chiizu|phô mai,カレー|karee|cà ri,ジュース|juusu|nước ép,ゲーム|geemu|trò chơi,アニメ|anime|phim hoạt hình,フォーク|fooku|cái nĩa,ナイフ|naifu|con dao,スプーン|supuun|cái thìa,トマト|tomato|cà chua,バナナ|banana|quả chuối,オレンジ|orenji|quả cam,ワイン|wain|rượu vang,ハンバーガー|hanbaagaa|bánh hamburger";
const parse=s=>s.split(",").map(x=>x.split(" "));
const kata=c=>[...c].map(x=>String.fromCharCode(x.charCodeAt(0)+96)).join("");
function split(w){const o=[];for(const c of w){if(o.length&&"ゃゅょャュョァィェォぁぃぅぇぉ".includes(c))o[o.length-1]+=c;else o.push(c)}return o}
const $=s=>document.querySelector(s);
let store={prog:{},cfg:{s:"h",dak:false,yoon:false,ext:false,vm:"read",vs:"all",ws:"h",wm:"trace",wg:true,wd:false,mode:"flash"}};
try{const j=JSON.parse(localStorage.getItem("kana1")||"null");if(j){store.prog=j.prog||{};Object.assign(store.cfg,j.cfg||{})}}catch(e){}
const save=()=>{try{localStorage.setItem("kana1",JSON.stringify(store))}catch(e){}};
const cfg=store.cfg;
let cards=[],words=[],tiles=[],got=[],vdone=false,vmsg="",cur=null,last=null,flipped=false,timer=null,q=null,score=0,streak=0,tdone=false,tmsg="";
const deckNow=()=>cfg.mode==="vocab"?words:cards;

function build(){
  let rows=parse(H);if(cfg.dak)rows=rows.concat(parse(D));if(cfg.yoon)rows=rows.concat(parse(Y));
  const sc=cfg.s==="both"?["h","k"]:[cfg.s];cards=[];
  sc.forEach(s=>rows.forEach(([c,r])=>cards.push({id:s+c,ch:s==="h"?c:kata(c),r})));
  if(cfg.ext&&sc.includes("k"))parse(X).forEach(([c,r])=>cards.push({id:"k"+c,ch:c,r}));
  words=W.split(",").map(x=>x.split("|")).map(([ch,r,m])=>({id:"v:"+ch,ch,r,m})).filter(w=>cfg.vs==="all"||(cfg.vs==="k")===/[ァ-ヺ]/.test(w.ch));
}
const box=c=>store.prog[c.id]||1;
function pick(){
  const W=[8,4,2,1,.5];
  const pool=deckNow().filter(c=>c.id!==last);
  const w=pool.map(c=>W[box(c)-1]);
  let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<pool.length;i++){t-=w[i];if(t<=0)return pool[i]}
  return pool[0];
}
function grade(ok){
  const b=box(cur);store.prog[cur.id]=ok?Math.min(5,b+1):1;save();
}
function say(){
  try{const u=new SpeechSynthesisUtterance(cur.ch);u.lang="ja-JP";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function next(){
  clearTimeout(timer);cur=pick();last=cur.id;flipped=false;tdone=false;tmsg="";q=null;vdone=false;vmsg="";got=[];tiles=[];
  if(cfg.mode==="vocab"&&cfg.vm==="build"){tiles=split(cur.ch).map(t=>({t,used:false}));for(let k=0;k<5;k++){tiles.sort(()=>Math.random()-.5);if(tiles.map(x=>x.t).join("")!==cur.ch)break}}
  if(cfg.mode==="quiz"){
    const others=[...new Set(cards.map(c=>c.r))].filter(r=>r!==cur.r).sort(()=>Math.random()-.5).slice(0,3);
    q={opts:[cur.r,...others].sort(()=>Math.random()-.5),done:false,pick:-1};
  }
  render();
}
function setMode(m){cfg.mode=m;save();score=0;streak=0;next()}
function setScript(s){cfg.s=s;save();build();last=null;next()}
function toggleDak(){cfg.dak=!cfg.dak;save();build();last=null;next()}
function tog(k){cfg[k]=!cfg[k];save();build();last=null;next()}
function setCfg(k,v){cfg[k]=v;save();build();last=null;next()}

function flip(){flipped=!flipped;if(flipped)say();renderMain()}
function rate(ok){grade(ok);next()}
function answer(i){
  if(q.done)return;q.done=true;q.pick=i;
  const ok=q.opts[i]===cur.r;grade(ok);
  if(ok){score++;streak++}else streak=0;
  render();timer=setTimeout(next,ok?650:1500);
}
function submitType(el){
  if(tdone){next();return}
  let v=el.value.trim().toLowerCase();if(!v)return;
  v=ALIAS[v]&&cur.r!=="wo"?ALIAS[v]:v;
  const ok=v===cur.r||(cur.r==="wo"&&(v==="wo"||v==="o"));
  grade(ok);tdone=true;
  if(ok){score++;streak++;tmsg='<span style="color:var(--ok)">Đúng rồi!</span>'}
  else{streak=0;tmsg='<span style="color:var(--bad)">Chưa đúng — đáp án: '+cur.r+'</span>'}
  say();renderMain();
}

function renderTabs(){
  const T=[["flash","Thẻ"],["quiz","Quiz"],["type","Gõ âm"],["vocab","Từ vựng"],["write","Viết"],["tips","Cách học"]];
  $("#tabs").innerHTML=T.map(([k,l])=>`<button class="${cfg.mode===k?"on":""}" onclick="setMode('${k}')">${l}</button>`).join("");
}
function renderCfg(){
  if(cfg.mode==="tips"){$("#cfg").innerHTML="";return}
  if(cfg.mode==="write"){const M=[["anim","Xem mẫu"],["trace","Tô theo nét"],["free","Tự viết"]];const chip=(on,fn,l,x)=>`<button class="chip ${x||""} ${on?"on":""}" onclick="${fn}">${l}</button>`;$("#cfg").innerHTML='<div class="chips">'+M.map(([k,l])=>chip(cfg.wm===k,`wset('wm','${k}')`,l)).join("")+'</div><div class="chips">'+chip(cfg.ws!=="k","wset('ws','h')","Hiragana")+chip(cfg.ws==="k","wset('ws','k')","Katakana")+chip(cfg.wd,"wset('wd',!cfg.wd)","+ Âm đục &amp; chữ nhỏ","jp")+(cfg.wm==="trace"?chip(cfg.wg,"wset('wg',!cfg.wg)","Nét mờ: "+(cfg.wg?"bật":"tắt")):"")+'</div>';return}
  if(cfg.mode==="vocab"){const A=[["read","Đọc"],["build","Ghép chữ"]],B=[["all","Tất cả"],["h","Hiragana"],["k","Katakana"]];$("#cfg").innerHTML='<div class="chips">'+A.map(([k,l])=>`<button class="chip ${cfg.vm===k?"on":""}" onclick="setCfg('vm','${k}')">${l}</button>`).join("")+'</div><div class="chips">'+B.map(([k,l])=>`<button class="chip ${cfg.vs===k?"on":""}" onclick="setCfg('vs','${k}')">${l}</button>`).join("")+'</div>';return}
  const S=[["h","Hiragana"],["k","Katakana"],["both","Cả hai"]];
  $("#cfg").innerHTML='<div class="chips">'+S.map(([k,l])=>`<button class="chip ${cfg.s===k?"on":""}" onclick="setScript('${k}')">${l}</button>`).join("")+
    `<button class="chip jp ${cfg.dak?"on":""}" onclick="toggleDak()">+ Âm đục が ぱ</button><button class="chip jp ${cfg.yoon?"on":""}" onclick="tog('yoon')">+ Âm ghép きゃ</button><button class="chip jp ${cfg.ext?"on":""}" onclick="tog('ext')">+ Katakana mở rộng ファ</button></div>`;
}
function renderStat(){
  if(cfg.mode==="tips"||cfg.mode==="write"){$("#stat").innerHTML="";return}
  const n=[0,0,0,0,0,0];let fresh=0;
  deckNow().forEach(c=>{if(store.prog[c.id])n[store.prog[c.id]]++;else fresh++});
  const mastered=n[4]+n[5],learning=n[1]+n[2]+n[3],t=deckNow().length;
  const col=["","#d6455d","#e8933a","#e6c53a","#6cc08b","#1b8f61"];
  let bar=[1,2,3,4,5].map(i=>`<i style="width:${n[i]/t*100}%;background:${col[i]}"></i>`).join("");
  $("#stat").innerHTML=`<div class="bar">${bar}</div><p>Đã thuộc ${mastered}/${t} · Đang học ${learning} · Chưa gặp ${fresh}</p>`;
}
function renderMain(){
  const m=cfg.mode,el=$("#main");
  if(m==="tips"){el.innerHTML=tipsHTML();return}
  if(m==="write"){writeMount();return}
  if(m==="vocab"){el.innerHTML=vocabHTML();return}
  const meta=m==="flash"?`<div class="meta"><span>Hộp ${box(cur)}/5</span><span>Space: lật · ← chưa nhớ · → nhớ rồi</span></div>`:

function vocabHTML(){
  if(cfg.vm==="read"){
    const meta=`<div class="meta"><span>Hộp ${box(cur)}/5</span><span>Space: lật · ← → chấm điểm</span></div>`;
    return meta+(!flipped?
      `<div class="card" onclick="flip()"><div class="kana w jp">${cur.ch}</div><div class="hint">Thử đọc thành tiếng, rồi chạm để lật</div></div><div class="row"><button class="btn pri" onclick="flip()">Lật thẻ</button></div>`:
      `<div class="card" onclick="flip()"><button class="spk" onclick="event.stopPropagation();say()" aria-label="Nghe phát âm">🔊</button><div class="kana w jp">${cur.ch}</div><div class="rom sm">${cur.r}</div><div class="mean">${cur.m}</div></div><div class="row"><button class="btn bad" onclick="rate(false)">✗ Chưa nhớ</button><button class="btn ok" onclick="rate(true)">✓ Nhớ rồi</button></div>`);
  }
  const slots=tiles.map((_,p)=>got[p]!==undefined?`<button class="slot jp ${vdone?(vmsg==="ok"?"right":"wrong"):""}" onclick="tapGot(${p})">${tiles[got[p]].t}</button>`:'<span class="slot"></span>').join("");
  const msg=!vdone?"":vmsg==="ok"?'<span style="color:var(--ok)">Đúng rồi!</span>':`<span style="color:var(--bad)">Đáp án: <span class="jp">${cur.ch}</span></span>`;
  return `<div class="meta"><span>Đúng: ${score}</span><span>Chuỗi: ${streak}</span></div><div class="card" style="cursor:default"><div class="mean">${cur.m}</div><div class="hint">${cur.r}</div><div class="slots">${slots}</div></div><div class="fb">${msg}</div><div class="tiles">`+
    tiles.map((t,i)=>`<button class="btn tile jp" ${t.used?"disabled":""} onclick="tapTile(${i})">${t.t}</button>`).join("")+"</div>";
}
function tapTile(i){
  if(vdone||tiles[i].used)return;tiles[i].used=true;got.push(i);
  if(got.length===tiles.length){vdone=true;const ok=got.map(k=>tiles[k].t).join("")===cur.ch;vmsg=ok?"ok":"no";grade(ok);if(ok){score++;streak++}else streak=0;say();render();timer=setTimeout(next,ok?1000:2200);return}
  renderMain();
}
function tapGot(p){if(vdone)return;tiles[got[p]].used=false;got.splice(p,1);renderMain()}
function render(){renderTabs();renderCfg();renderStat();renderMain()}

function tipsHTML(){return `<div class="tips">
<div class="box"><b>Lộ trình gợi ý:</b> Hiragana trước (7–10 ngày), sau đó mới Katakana (7–10 ngày). Mỗi ngày học 5 chữ mới, ôn lại các chữ cũ.</div>
<h2>1. Ôn nhắc lại ngắt quãng</h2>
<p>Ôn đúng lúc sắp quên thì nhớ lâu nhất. Ứng dụng này chia thẻ vào 5 hộp: nhớ đúng thì lên hộp cao (xuất hiện thưa dần), quên thì về hộp 1 (xuất hiện dày). Mốc tự ôn tay: ngày 1 → 2 → 4 → 7 → 14.</p>
<h2>2. Nhớ chủ động thay vì đọc lại</h2>
<p>Nhìn chữ, tự đoán âm trước khi lật thẻ. Rồi làm ngược lại: nghe âm, viết chữ ra giấy. Việc cố nhớ lại chính là lúc não ghi nhớ.</p>
<h2>3. Gắn hình ảnh với mỗi chữ</h2>
<ul class="jp"><li>ふ (fu): đỉnh núi Phú Sĩ – Fuji</li><li>め (me): con mắt, “mê” nhìn</li><li>ぬ (nu): sợi mì (noodle) cuộn lại</li><li>き (ki): chiếc chìa khoá (key)</li><li>つ (tsu): con sóng đang cuộn vào bờ</li></ul>
<p>Tự bịa hình ảnh của riêng bạn, càng buồn cười càng dễ nhớ.</p>
<h2>4. Viết tay đúng thứ tự nét</h2>
<p>Viết mỗi chữ 3–5 lần, vừa viết vừa đọc to. Tay, mắt và miệng cùng làm sẽ nhớ chắc hơn chỉ nhìn. Dùng tab Viết để tập ngay trên màn hình (ngón tay hoặc Apple Pencil): xem mẫu, tô theo nét, rồi tự viết và so đáp án.</p>
<h2>5. Tách các cặp dễ nhầm</h2>
<div class="jp"><span class="pair">シ ツ</span><span class="pair">ソ ン</span><span class="pair">さ き</span><span class="pair">ぬ め</span><span class="pair">る ろ</span><span class="pair">わ れ ね</span><span class="pair">ク ケ タ</span></div>
<p>Học riêng từng cặp, so sánh nét khác nhau. Ví dụ シ và ツ: シ có nét chấm nằm ngang, ツ có nét chấm gần thẳng đứng.</p>
<h2>6. Âm ghép (yōon) và dấu nhỏ</h2>
<p class="jp">き + ゃ = きゃ (kya): chữ ゃ ゅ ょ viết nhỏ, đọc liền thành 1 âm chứ không đọc rời.<br>っ / ッ nhỏ: ngắt nhẹ rồi đọc đôi phụ âm tiếp theo (きって = kitte).<br>ー: kéo dài nguyên âm trong katakana (コーヒー = koohii).</p>
<p>Bật “+ Âm ghép” và “+ Katakana mở rộng” ở các tab Thẻ, Quiz, Gõ âm để luyện riêng nhóm này.</p>
<h2>7. Đọc từ thật: dùng tab Từ vựng</h2>
<p class="jp">すし · さけ · ねこ · いぬ (hiragana)<br>コーヒー · ビール · アイス · ホテル (katakana)</p>
<p>Ghép chữ thành từ quen thuộc giúp não gắn chữ với nghĩa, nhớ lâu hơn nhiều so với chữ rời.</p>
<h2>8. Học ngắn nhưng đều</h2>
<p>10–15 phút, 2–3 lần mỗi ngày tốt hơn 1 giờ học dồn. Ôn lần cuối trước khi ngủ, vì giấc ngủ giúp củng cố trí nhớ.</p>
</div>`}

  const o=[];let j=1;
  for(let i=0;i<n;i++){const t=L*i/(n-1);while(j<pts.length-1&&s[j]<t)j++;
    const a=pts[j-1],b=pts[j],u=Math.min(1,Math.max(0,(t-s[j-1])/((s[j]-s[j-1])||1)));
    o.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}
  return{o,L};
}
function wcheck(pts,d){
  const el=$("#wtmp");el.setAttribute("d",d);
  const Li=el.getTotalLength(),I=wsamp(el,16);
  if(pts.length<2)pts=[pts[0],pts[0]];
  const{o:U,L:Lu}=wres(pts,16),dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(Li<14)return dist(I[8],U[8])<18&&Lu<40;
  let m=0;for(let i=0;i<16;i++)m+=dist(I[i],U[i]);m/=16;
  return dist(I[0],U[0])<22&&dist(I[15],U[15])<22&&m<14&&Lu>Li*.5&&Lu<Li*1.8;
}
function wend(pts){
  if(cfg.wm==="free"){WS.free.push(pts);wdraw();return}
  const c=wl[wi];
  if(wcheck(pts,c.d[WS.si])){
    WS.si++;WS.fails=0;
    if(WS.si>=c.d.length){WS.done=true;wsay()}
    wdraw();
  }else{
    WS.fails++;const b=$("#wbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
    wmsg("Chưa đúng nét "+(WS.si+1)+", thử lại nhé","bad");
    if(WS.fails>=2)whint();
  }
}
function wdraw(){
  const c=wl[wi],n=c.d.length,m=cfg.wm;let g="",st="";
  if(m==="trace"){
    if(cfg.wg)g+=c.d.map(d=>`<path class="wgh" d="${d}"/>`).join("");
    g+=c.d.slice(0,WS.si).map(d=>`<path class="wdn" d="${d}"/>`).join("");
    if(!WS.done&&cfg.wg){const p=wstart(c.d[WS.si]);g+=`<circle class="wdot" cx="${p[0]}" cy="${p[1]}" r="4.6"/><text class="wnum" x="${p[0]}" y="${p[1]+2}">${WS.si+1}</text>`}
    st=WS.done?"Xong ✓":"Nét "+(WS.si+1)+"/"+n;
    if(WS.done)wmsg("Hoàn thành! Bấm “Chữ tiếp” hoặc “Viết lại”","ok");else if(!WS.fails)wmsg(cfg.wg?"Viết theo nét có số "+(WS.si+1):"Viết nét "+(WS.si+1)+" (đang ẩn nét mờ)");
  }else if(m==="free"){
    g+=WS.free.map(s=>`<path class="wus" d="${wpd(s)}"/>`).join("");
    if(WS.show)g+=c.d.map(d=>`<path class="wans" d="${d}"/>`).join("")+c.d.map((d,i)=>{const p=wstart(d);return`<circle class="wdot" cx="${p[0]}" cy="${p[1]}" r="4.6"/><text class="wnum" x="${p[0]}" y="${p[1]+2}">${i+1}</text>`}).join("");
    st="Tự viết ("+n+" nét)";wmsg("");
  }
  $("#wlay").innerHTML=g;$("#wst").textContent=st;
}
function wplay(){
  const c=wl[wi];let g=c.d.map(d=>`<path class="wan" d="${d}"/>`).join("");
  g+=c.d.map((d,i)=>{const p=wstart(d);return`<g class="wnl" style="opacity:0"><circle class="wdot" cx="${p[0]}" cy="${p[1]}" r="4.6"/><text class="wnum" x="${p[0]}" y="${p[1]+2}">${i+1}</text></g>`}).join("");
  $("#wlay").innerHTML=g;$("#wst").textContent=c.d.length+" nét";wmsg("Xem thứ tự nét, rồi chuyển sang “Tô theo nét”");
  const P=[...$("#wlay").querySelectorAll(".wan")],N=[...$("#wlay").querySelectorAll(".wnl")];
  P.forEach((e,i)=>{const L=e.getTotalLength()+1;e.style.strokeDasharray=L;e.style.strokeDashoffset=L;
    e.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:650,delay:i*900,fill:"forwards",easing:"ease-in-out"});
    N[i].animate([{opacity:0},{opacity:1}],{duration:150,delay:i*900,fill:"forwards"})});
}
function whint(){
  if(cfg.wm!=="trace"||WS.done)return;
  const h=$("#whn");h.innerHTML=`<path class="whn" d="${wl[wi].d[WS.si]}"/>`;const e=h.firstChild,L=e.getTotalLength()+1;
  e.style.strokeDasharray=L;e.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:900,fill:"forwards",easing:"ease-in-out"});
  clearTimeout(wtm);wtm=setTimeout(()=>{h.innerHTML=""},1800);
}
function wreplay(){wreset();$("#whn").innerHTML="";wdraw()}
function wundo(){WS.free.pop();wdraw()}
function wclear(){WS.free=[];WS.show=false;wdraw()}
function wshow(){WS.show=!WS.show;wdraw()}

build();next();
</script>
